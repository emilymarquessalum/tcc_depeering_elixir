version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tcc_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcc_depeering_elixir_prod 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc_phoenix_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      PHX_HOST: "localhost"
      PHX_SERVER: "true"
      DATABASE_URL: "ecto://postgres:postgres@db:5432/tcc_depeering_elixir_prod"
      SECRET_KEY_BASE: ""

volumes:
  postgres_data: